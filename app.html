<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivaskunj Interiors | Loading...</title>
    
    <style>
        :root {
            --color-gold: #B8860B;
            --color-dark: #1a1a1a;
            --color-glass: rgba(255, 255, 255, 0.03);
            --font-heading: 'Cormorant Garamond', serif;
            --font-body: 'Montserrat', sans-serif;
        }

        /* Luxury Gradient Background */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background: radial-gradient(circle at center, #2c2c2c 0%, #121212 100%);
            color: #ffffff;
            font-family: var(--font-body);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .intro-wrapper {
            text-align: center;
            padding: 40px;
            backdrop-filter: blur(10px);
            background: var(--color-glass);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            max-width: 90%;
        }

        /* Smooth Reveal Animations */
        .logo-image {
            width: 320px;
            height: auto;
            margin-bottom: 30px;
            filter: brightness(0) invert(1); /* Makes logo white for dark theme */
            opacity: 0;
            transform: translateY(20px);
            animation: revealUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .company-name {
            font-family: var(--font-heading);
            font-size: 2.8rem;
            font-weight: 300;
            letter-spacing: 12px;
            text-transform: uppercase;
            margin-bottom: 10px;
            opacity: 0;
            animation: revealUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            animation-delay: 0.4s;
        }

        .tagline {
            font-size: 0.85rem;
            letter-spacing: 5px;
            color: var(--color-gold);
            text-transform: uppercase;
            opacity: 0;
            animation: fadeIn 1.5s ease forwards;
            animation-delay: 1.2s;
        }

        /* Minimalist Line Loader */
        .loader-container {
            width: 250px;
            height: 1px;
            background: rgba(255,255,255,0.1);
            margin: 50px auto 0;
            position: relative;
            overflow: hidden;
        }

        .loader-bar {
            position: absolute;
            left: 0;
            height: 100%;
            width: 0;
            background: var(--color-gold);
            box-shadow: 0 0 10px var(--color-gold);
            animation: progress 4s cubic-bezier(0.445, 0.05, 0.55, 0.95) forwards;
            animation-delay: 1.5s;
        }

        @keyframes revealUp {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @keyframes progress {
            0% { width: 0%; left: 0; }
            100% { width: 100%; }
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .company-name { font-size: 1.4rem; letter-spacing: 6px; }
            .logo-image { width: 220px; }
            .tagline { font-size: 0.7rem; letter-spacing: 3px; }
        }
    </style>

    <meta http-equiv="refresh" content="6; url=https://nivaskunjinteriors.vercel.app/" />
</head>
<body>

    <div class="intro-wrapper">
        <img src="https://github.com/ranadeep-banik137/NivasKunjInteriors/blob/main/logo%20transparent%20PNG.png?raw=true" 
             alt="Logo" class="logo-image">
        
        <div class="company-name">Nivaskunj</div>
        <div class="tagline">Interiors • Architecture • Design</div>

        <div class="loader-container">
            <div class="loader-bar"></div>
        </div>
    </div>

</body>
</html>
